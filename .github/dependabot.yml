version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "area:supply-chain"
      - "type:hardening"
      - "priority:P2"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "area:supply-chain"
      - "area:ci-cd"
      - "priority:P2"
